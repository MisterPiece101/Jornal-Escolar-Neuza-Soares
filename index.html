<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornal da Escola</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 4px 10px rgba(0,0,0,0.06);
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.9rem; font-weight: 800; }
    header p { font-size: 0.95rem; opacity: 0.92; margin-top: 0.2rem; }
    nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    nav button {
      padding: 0.55rem 0.95rem;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    nav button:hover { background: var(--primary-dark); }
    main {
      max-width: 1000px;
      margin: 1.5rem auto;
      padding: 0 1rem 2rem;
      flex: 1;
      width: 100%;
    }
    .page {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow);
    }
    .page.active { display: block; }
    h2 { color: var(--primary); margin-bottom: 0.5rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.8rem;
    }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.95rem;
      background: #fafbfc;
    }
    .card h4 { color: var(--primary-dark); margin-bottom: 0.4rem; }
    .card p { font-size: 0.92rem; color: #444; white-space: pre-wrap; }
    .meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }
    input, textarea, button {
      width: 100%;
      padding: 0.7rem;
      margin: 0.4rem 0;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-family: inherit;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    .msg { margin-top: 0.7rem; font-weight: 700; }
    .msg.erro { color: #dc2626; }
    .msg.sucesso { color: #16a34a; }
    .login-box, .user-box {
      max-width: 340px;
      margin: 1rem auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      background: #fafbfc;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: var(--card);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>📰 Jornal da Escola</h1>
    <p>Notícias, eventos e comentários</p>
  </header>

  <nav>
    <button onclick="ir('inicio')">Início</button>
    <button onclick="ir('noticias')">Notícias</button>
    <button onclick="ir('eventos')">Eventos</button>
    <button onclick="ir('comentarios')">Comentários</button>
    <button onclick="ir('publicar')">Publicar</button>
    <button onclick="ir('login')">Entrar</button>
  </nav>

  <main>
    <section id="inicio" class="page active">
      <h2>Bem-vindo!</h2>
      <p>Use o menu acima para navegar.</p>
    </section>

    <section id="noticias" class="page">
      <h2>Notícias</h2>
      <div id="lista-noticias" class="grid">Carregando...</div>
    </section>

    <section id="eventos" class="page">
      <h2>Eventos</h2>
      <div id="lista-eventos" class="grid">Carregando...</div>
    </section>

    <section id="comentarios" class="page">
      <h2>Comentários</h2>
      <div id="lista-comentarios" class="grid">Carregando...</div>
    </section>

    <section id="publicar" class="page">
      <h2>Publicar</h2>
      <div id="aviso">
        <p>Faça login para publicar.</p>
        <button onclick="ir('login')">Ir para login</button>
      </div>
      <div id="form-publicar" style="display:none;">
        <h3>Nova Notícia</h3>
        <input type="text" id="titulo-noticia" placeholder="Título" />
        <textarea id="conteudo-noticia" placeholder="Conteúdo" rows="4"></textarea>
        <button onclick="pubNoticia()">Publicar Notícia</button>

        <h3 style="margin-top:1.1rem;">Novo Evento</h3>
        <input type="text" id="titulo-evento" placeholder="Título" />
        <input type="text" id="data-evento" placeholder="Data (ex: 25/09/2026)" />
        <textarea id="conteudo-evento" placeholder="Descrição" rows="3"></textarea>
        <button onclick="pubEvento()">Publicar Evento</button>

        <div id="msg-pub" class="msg"></div>
      </div>
    </section>

    <section id="login" class="page">
      <h2>Entrar</h2>
      <div id="login-form" class="login-box">
        <input type="text" id="login-nome" placeholder="Seu nome (ex: Gustavo)" />
        <input type="password" id="login-senha" placeholder="Senha" />
        <button onclick="fazerLogin()">Entrar</button>
        <div id="msg-login" class="msg"></div>
      </div>
      <div id="user-area" class="user-box" style="display:none;">
        <p style="font-size:1.05rem;font-weight:700;color:#1a73e8;">
          Olá, <span id="nome-user">Usuário</span>!
        </p>
        <button onclick="fazerLogout()" style="margin-top:0.5rem;background:#dc2626;">Sair</button>
      </div>
    </section>
  </main>

  <footer>© 2026 Jornal da Escola</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://whfyyenctppnociyfhfn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OxuXce2Y68ZzFkO8G5Opwg_H-AmYXDw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let usuario = null;

    function ir(p) {
      document.querySelectorAll('.page').forEach(s => s.classList.remove('active'));
      document.getElementById(p).classList.add('active');
      if (p === 'noticias') carregarNoticias();
      if (p === 'eventos') carregarEventos();
      if (p === 'comentarios') carregarComentarios();
      if (p === 'publicar') atualizarPublicar();
      if (p === 'login') atualizarLogin();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function atualizarLogin() {
      const form = document.getElementById('login-form');
      const user = document.getElementById('user-area');
      const nome = document.getElementById('nome-user');
      if (usuario) {
        form.style.display = 'none';
        user.style.display = 'block';
        nome.textContent = usuario.nome;
      } else {
        form.style.display = 'block';
        user.style.display = 'none';
      }
    }

    async function fazerLogin() {
      const nomeIn = document.getElementById('login-nome');
      const senhaIn = document.getElementById('login-senha');
      const msg = document.getElementById('msg-login');
      const nome = nomeIn.value.trim();
      const senha = senhaIn.value;
      msg.textContent = '';
      msg.className = 'msg';
      if (!nome || !senha) {
        msg.textContent = 'Digite nome e senha.';
        msg.classList.add('erro');
        return;
      }
      const email = nome.toLowerCase() + '@escola.com.br';
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
        if (error) throw error;
        usuario = { id: data.user.id, nome: nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase() };
        msg.textContent = 'Login realizado!';
        msg.classList.add('sucesso');
        nomeIn.value = '';
        senhaIn.value = '';
        atualizarLogin();
      } catch (e) {
        msg.textContent = 'Login falhou. Verifique nome e senha.';
        msg.classList.add('erro');
        console.error(e);
      }
    }

    function fazerLogout() {
      supabase.auth.signOut();
      usuario = null;
      atualizarLogin();
      ir('inicio');
    }

    function atualizarPublicar() {
      const aviso = document.getElementById('aviso');
      const form = document.getElementById('form-publicar');
      if (usuario) {
        aviso.style.display = 'none';
        form.style.display = 'block';
      } else {
        aviso.style.display = 'block';
        form.style.display = 'none';
      }
    }

    async function carregarNoticias() {
      const div = document.getElementById('lista-noticias');
      div.textContent = 'Carregando...';
      try {
        const { data, error } = await supabase.from('noticias').select('*').order('criado_em', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
          div.textContent = 'Nenhuma notícia ainda.';
          return;
        }
        div.innerHTML = '';
        data.forEach(n => {
          const card = document.createElement('div');
          card.className = 'card';
          const dataFmt = n.criado_em ? new Date(n.criado_em).toLocaleDateString('pt-BR') : '';
          card.innerHTML = `<h4>${esc(n.titulo||'Sem título')}</h4><p>${esc(n.conteudo||'')}</p><div class="meta">Por ${esc(n.autor||'Anônimo')} em ${dataFmt}</div>`;
          div.appendChild(card);
        });
      } catch (e) {
        div.textContent = 'Erro ao carregar notícias.';
        console.error(e);
      }
    }

    async function carregarEventos() {
      const div = document.getElementById('lista-eventos');
      div.textContent = 'Carregando...';
      try {
        const { data, error } = await supabase.from('eventos').select('*').order('criado_em', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
          div.textContent = 'Nenhum evento ainda.';
          return;
        }
        div.innerHTML = '';
        data.forEach(e => {
          const card = document.createElement('div');
          card.className = 'card';
          const dataFmt = e.criado_em ? new Date(e.criado_em).toLocaleDateString('pt-BR') : '';
          card.innerHTML = `<h4>${esc(e.titulo||'Sem título')}</h4><p><strong>Data:</strong> ${esc(e.data_evento||'Sem data')}</p><p>${esc(e.conteudo||'')}</p><div class="meta">Por ${esc(e.autor||'Anônimo')} em ${dataFmt}</div>`;
          div.appendChild(card);
        });
      } catch (e) {
        div.textContent = 'Erro ao carregar eventos.';
        console.error(e);
      }
    }

    async function carregarComentarios() {
      const div = document.getElementById('lista-comentarios');
      div.textContent = 'Carregando...';
      try {
        const { data, error } = await supabase.from('comentarios').select('*').order('criado_em', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
          div.textContent = 'Nenhum comentário ainda.';
          return;
        }
        div.innerHTML = '';
        data.forEach(c => {
          const card = document.createElement('div');
          card.className = 'card';
          const dataFmt = c.criado_em ? new Date(c.criado_em).toLocaleDateString('pt-BR') : '';
          card.innerHTML = `<h4>${esc(c.autor||'Anônimo')}</h4><p>${esc(c.conteudo||'')}</p><div class="meta">Em ${dataFmt}</div>`;
          div.appendChild(card);
        });
      } catch (e) {
        div.textContent = 'Erro ao carregar comentários.';
        console.error(e);
      }
    }

    async function pubNoticia() {
      const tit = document.getElementById('titulo-noticia').value.trim();
      const cont = document.getElementById('conteudo-noticia').value.trim();
      const msg = document.getElementById('msg-pub');
      msg.textContent = '';
      msg.className = 'msg';
      if (!usuario) {
        msg.textContent = 'Faça login para publicar.';
        msg.classList.add('erro');
        return;
      }
      if (!tit || !cont) {
        msg.textContent = 'Preencha título e conteúdo.';
        msg.classList.add('erro');
        return;
      }
      try {
        const { error } = await supabase.from('noticias').insert([{
          titulo: tit,
          conteudo: cont,
          autor: usuario.nome,
          criado_por: usuario.id,
          criado_em: new Date().toISOString()
        }]);
        if (error) throw error;
        msg.textContent = 'Notícia publicada!';
        msg.classList.add('sucesso');
        document.getElementById('titulo-noticia').value = '';
        document.getElementById('conteudo-noticia').value = '';
      } catch (e) {
        msg.textContent = 'Erro ao publicar notícia.';
        msg.classList.add('erro');
        console.error(e);
      }
    }

    async function pubEvento() {
      const tit = document.getElementById('titulo-evento').value.trim();
      const data = document.getElementById('data-evento').value.trim();
      const cont = document.getElementById('conteudo-evento').value.trim();
      const msg = document.getElementById('msg-pub');
      msg.textContent = '';
      msg.className = 'msg';
      if (!usuario) {
        msg.textContent = 'Faça login para publicar.';
        msg.classList.add('erro');
        return;
      }
      if (!tit || !cont) {
        msg.textContent = 'Preencha título e descrição.';
        msg.classList.add('erro');
        return;
      }
      try {
        const { error } = await supabase.from('eventos').insert([{
          titulo: tit,
          data_evento: data,
          conteudo: cont,
          autor: usuario.nome,
          criado_por: usuario.id,
          criado_em: new Date().toISOString()
        }]);
        if (error) throw error;
        msg.textContent = 'Evento publicado!';
        msg.classList.add('sucesso');
        document.getElementById('titulo-evento').value = '';
        document.getElementById('data-evento').value = '';
        document.getElementById('conteudo-evento').value = '';
      } catch (e) {
        msg.textContent = 'Erro ao publicar evento.';
        msg.classList.add('erro');
        console.error(e);
      }
    }

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    window.addEventListener('DOMContentLoaded', () => {
      ir('inicio');
    });
  </script>
</body>
</html>
